<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Password recovery · VisaAtlas</title>
  <link rel="stylesheet" href="/password-recovery.css">
  <script src="/password-recovery.js" defer></script>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">VA</div>
    <h1 id="title">Forgot your password?</h1>
    <p id="description">Enter your account email to request a reset link.</p>
    <form id="requestForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="160" required>
      <button type="submit">Send reset link</button>
    </form>
    <form id="resetForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="15" maxlength="128" aria-describedby="passwordHelp" required>
      <p id="passwordHelp" class="help">Use 15–128 characters. A long passphrase works well.</p>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>
      <button type="submit">Reset password</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="requestAgain" hidden><a href="/password-recovery.html">Request a new reset link</a></p>
    <p><a href="/?signin=1">Back to sign in</a></p>
    <noscript>Enable JavaScript to reset your password.</noscript>
  </main>
</body>
</html>
